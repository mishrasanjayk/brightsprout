<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="BrightSprout">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>BrightSprout</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: a single phone-width app column, sticky header with profile switcher, fixed bottom tab bar */
:root{
  --bg:#F3F7F1; --surface:#FFFFFF; --surface-2:#E8F0E4; --ink:#1F2B24; --muted:#5E6E64; --line:#D5E1D0;
  --leaf:#2F9E5B; --leaf-ink:#FFFFFF; --sun:#F5B731; --sun-soft:#FFF1C9; --sky:#3A8FD9; --berry:#E2576B; --plum:#7E5BD6;
  --star:#E89B0C; --shadow:0 2px 0 rgba(31,43,36,.08);
  --display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111814; --surface:#1A231E; --surface-2:#223029; --ink:#E9F1EA; --muted:#9DB0A3; --line:#2E3D35;
  --leaf:#4CC27C; --leaf-ink:#0D1A12; --sun:#F7C64F; --sun-soft:#3A3117; --sky:#64A9E8; --berry:#F07A8B; --plum:#A88BF0;
  --star:#F7C64F; --shadow:0 2px 0 rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111814; --surface:#1A231E; --surface-2:#223029; --ink:#E9F1EA; --muted:#9DB0A3; --line:#2E3D35;
  --leaf:#4CC27C; --leaf-ink:#0D1A12; --sun:#F7C64F; --sun-soft:#3A3117; --sky:#64A9E8; --berry:#F07A8B; --plum:#A88BF0;
  --star:#F7C64F; --shadow:0 2px 0 rgba(0,0,0,.3); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
html{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:600}
.app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{font-size:22px;color:var(--leaf);display:flex;align-items:center;gap:6px}
.brand small{font-family:var(--body);color:var(--muted);font-size:12px;font-weight:700}
.slogan{margin:2px 0 0;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.reset{white-space:nowrap;font-size:12px;color:var(--muted);font-weight:700;padding:6px 8px}
.profiles{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.profiles::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--surface);border:2px solid var(--line);white-space:nowrap;font-weight:700;font-size:14px}
.chip .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:var(--surface-2)}
.chip[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf);color:var(--leaf-ink)}
.chip[aria-pressed="true"] .av{background:rgba(255,255,255,.25)}
.chip .age{font-weight:600;opacity:.75;font-size:12px}
main{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 110px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.hello{display:flex;gap:12px;align-items:center}
.hello h2{font-size:24px}
.hello p{margin:2px 0 0;color:var(--muted);font-weight:600;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.stat.stars b{color:var(--star)} .stat.streak b{color:var(--berry)} .stat.goal b{color:var(--sky)}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.section-title h3{font-size:18px}
.section-title span{color:var(--muted);font-size:13px;font-weight:700}
.pillars{display:flex;gap:6px;flex-wrap:wrap}
.pfilter{padding:6px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.pfilter[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.quests{display:flex;flex-direction:column;gap:10px}
.quest{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.quest .ic{width:48px;height:48px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:26px}
.quest .txt{flex:1;min-width:0}
.quest .txt b{display:block;font-size:15px;line-height:1.25}
.quest .txt small{color:var(--muted);font-weight:700;font-size:12px}
.qbtn{flex:none;min-width:76px;padding:10px 12px;border-radius:14px;font-weight:800;font-size:14px;background:var(--leaf);color:var(--leaf-ink)}
.qbtn.pending{background:var(--sun-soft);color:var(--ink)}
.qbtn.done{background:var(--surface-2);color:var(--leaf)}
.qbtn:disabled{cursor:default}
.p-eat{background:#E4F5DA} .p-move{background:#DCEBFA} .p-family{background:#FBE1E5} .p-learn{background:#ECE4FB} .p-rest{background:#FFF1C9}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .p-eat{background:#24402C}:root:not([data-theme="light"]) .p-move{background:#1F3448}:root:not([data-theme="light"]) .p-family{background:#47262C}:root:not([data-theme="light"]) .p-learn{background:#30284A}:root:not([data-theme="light"]) .p-rest{background:#3A3117}}
:root[data-theme="dark"] .p-eat{background:#24402C}:root[data-theme="dark"] .p-move{background:#1F3448}:root[data-theme="dark"] .p-family{background:#47262C}:root[data-theme="dark"] .p-learn{background:#30284A}:root[data-theme="dark"] .p-rest{background:#3A3117}
/* Little Sprouts big tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:24px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:3px solid transparent;font-weight:800;font-size:15px;position:relative}
.tile .big{font-size:48px;line-height:1}
.tile .st{font-size:13px;color:var(--muted);font-weight:800}
.tile.pending{border-color:var(--sun)} .tile.done{border-color:var(--leaf)}
.tile .badge{position:absolute;top:8px;right:8px;font-size:12px;background:var(--surface);border-radius:999px;padding:2px 8px;font-weight:800}
.pet{display:flex;align-items:center;gap:14px}
.pet .sprout{font-size:56px;line-height:1;transition:transform .4s}
.bar{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:999px;transition:width .5s}
.bar.sky i{background:var(--sky)} .bar.sun i{background:var(--sun)}
.speak{font-size:13px;font-weight:800;color:var(--sky);padding:4px 0}
/* shop */
.shop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.reward{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.reward .big{font-size:34px}
.reward b{font-size:14px;line-height:1.25;flex:1}
.cost{font-weight:800;color:var(--star);font-variant-numeric:tabular-nums}
.rbtn{padding:8px;border-radius:12px;font-weight:800;font-size:13px;background:var(--sun);color:#3A2A00}
.rbtn:disabled{background:var(--surface-2);color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bdg{text-align:center;font-size:11px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;gap:4px;align-items:center}
.bdg .m{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--surface-2);filter:grayscale(1);opacity:.45}
.bdg.on{color:var(--ink)} .bdg.on .m{filter:none;opacity:1;background:var(--sun-soft);box-shadow:0 0 0 3px var(--sun) inset}
/* parent */
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.list{display:flex;flex-direction:column;gap:10px}
.appr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.appr:last-child{border-bottom:0}
.appr .who{font-size:12px;color:var(--muted);font-weight:800}
.ok{background:var(--leaf);color:var(--leaf-ink);padding:8px 12px;border-radius:12px;font-weight:800;font-size:13px}
.no{background:var(--surface-2);padding:8px 10px;border-radius:12px;font-weight:800;font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-weight:600;text-align:center;padding:12px 0;font-size:14px}
.price{display:flex;align-items:center;gap:6px}
.price button{width:32px;height:32px;border-radius:10px;background:var(--surface-2);font-weight:800}
.price span{min-width:44px;text-align:center;font-weight:800;color:var(--star);font-variant-numeric:tabular-nums}
.addform{display:flex;gap:8px;flex-wrap:wrap}
.addform input{flex:1 1 160px;min-width:0;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
.addform input[type=number]{flex:0 0 84px}
.kidsum{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.kidsum:last-child{border-bottom:0}
.mini{display:grid;grid-template-columns:70px 1fr 34px;gap:8px;align-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.mini em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);line-height:1.45;margin:0}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav .in{max-width:460px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav button{padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--muted);position:relative}
nav button .i{font-size:22px;line-height:1}
nav button[aria-current="page"]{color:var(--leaf)}
nav .dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:999px;background:var(--berry);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;transition:.25s;z-index:20;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.burst{position:fixed;pointer-events:none;z-index:30;font-size:22px;animation:fly .9s ease-out forwards}
@keyframes fly{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.2);opacity:0}}
@media (prefers-reduced-motion: reduce){.burst{display:none}.toast,.bar i,.pet .sprout{transition:none}}
.vid{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--berry);color:#fff;text-decoration:none;font-size:15px;font-weight:800}
.vlist{display:flex;flex-direction:column;gap:8px}
.vrow{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}
.vrow .ic{width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:24px}
.vrow b{flex:1;min-width:0;font-size:15px;line-height:1.25}
.vrow .play{flex:none;background:var(--berry);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800}
.daily{border:2px solid var(--sun)}
.dstep{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.dstep:last-of-type{border-bottom:0}
.dnum{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sun-soft);font-weight:800;font-size:13px}
.dstep.done .dnum{background:var(--leaf);color:var(--leaf-ink)}
.dic{font-size:26px;flex:none}
.dstep .txt{flex:1;min-width:0}.dstep .txt b{display:block;font-size:15px;line-height:1.25}.dstep .txt small{color:var(--muted);font-weight:700;font-size:12px}
.dact{display:flex;gap:6px;flex:none}.dact .qbtn{min-width:0}
.qq{font-family:var(--display);font-size:20px;font-weight:600;margin:12px 0;line-height:1.3}
.opts{display:flex;flex-direction:column;gap:8px}.opts.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{text-align:left;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-weight:800;font-size:15px}
.opts.big .opt{text-align:center;font-size:22px;padding:18px 8px}
.opt.right{border-color:var(--leaf);background:var(--surface-2);color:var(--leaf)}.opt.wrong{border-color:var(--berry);color:var(--berry)}
.opt:disabled{cursor:default}
.why{margin-top:12px;padding:12px;border-radius:14px;background:var(--sun-soft);font-size:14px;line-height:1.45}.why.ok{background:var(--surface-2)}
.vslot{padding:10px 0;border-bottom:1px solid var(--line)}.vslot:last-child{border-bottom:0}
.vslot b{display:block;font-size:14px}
.vt{display:block;font-size:12px;font-weight:700;color:var(--sky);text-decoration:none;margin-top:2px;line-height:1.35}
.vh{margin:12px 0 0;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tag.st-approved,.tag.st-yourpick{background:var(--surface-2);color:var(--leaf)}.tag.st-needsreview{background:var(--sun-soft);color:var(--ink)}
.sheet[hidden]{display:none!important}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,20,14,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{width:100%;max-width:460px;background:var(--surface);border-radius:24px 24px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.frame{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:#000}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.demo{font-size:12px;color:var(--muted);text-align:center;margin:4px 0 0}
</style>

<div class="app">
  <header>
    <div class="brand">
      <div><h1><span aria-hidden="true">🌱</span> <span id="appname"></span> <small>prototype</small></h1><p class="slogan" id="slogan"></p></div>
      <button class="reset" id="reset">Reset demo</button>
    </div>
    <div class="profiles" id="profiles" role="group" aria-label="Choose who is using the app"></div>
  </header>
  <main id="main"></main>
  <nav><div class="in" id="tabs"></div></nav>
</div>
<div class="sheet" id="player" hidden role="dialog" aria-modal="true" aria-label="Video player">
  <div class="sheet-in">
    <div class="row" style="margin-bottom:10px"><b class="grow" id="ptitle" style="font-family:var(--display);font-size:17px"></b><button class="no" id="pclose">Close</button></div>
    <div class="frame"><iframe id="pframe" title="Video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
    <p class="note" style="margin-top:10px">Video not showing? Some previews block players. <a id="pout" target="_blank" rel="noopener" style="color:var(--sky);font-weight:800">Open in YouTube</a></p>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// Change the app name and slogan here
const APP_NAME="BrightSprout";
const SLOGAN="Making the next gen smarter and healthier";
document.getElementById("appname").textContent=APP_NAME;document.getElementById("slogan").textContent=SLOGAN;
const PILLARS={eat:{name:"Eat well",icon:"🥦"},move:{name:"Move & play",icon:"⚽"},family:{name:"Family & friends",icon:"🤝"},learn:{name:"Learn & create",icon:"📚"},rest:{name:"Rest & balance",icon:"🌙"}};
const BANDS={sprout:{name:"Little Sprouts",ages:"2–5"},explorer:{name:"Explorers",ages:"6–9"},trail:{name:"Trailblazers",ages:"10–14"}};
const ACTIVITIES={
  sprout:[
    {id:"s1",p:"eat",icon:"🌈",t:"Eat a rainbow plate",q:"eat the rainbow song for kids",s:10},
    {id:"s2",p:"eat",icon:"💧",t:"Drink water, not juice",s:5},
    {id:"s3",p:"move",icon:"🛝",t:"Play outside",s:15},
    {id:"s4",p:"move",icon:"💃",t:"Dance party",q:"kids dance party song",s:10},
    {id:"s5",p:"family",icon:"📖",t:"Read a book together",s:15},
    {id:"s6",p:"family",icon:"🧸",t:"Help tidy toys",s:10},
    {id:"s7",p:"learn",icon:"🧱",t:"Build with blocks",s:10},
    {id:"s8",p:"rest",icon:"🛏️",t:"Bedtime on time",s:10}],
  explorer:[
    {id:"e1",p:"eat",icon:"🥕",t:"Try a new vegetable",q:"trying new vegetables kids cartoon",s:15},
    {id:"e2",p:"eat",icon:"🥪",t:"Help pack lunch",s:10},
    {id:"e3",p:"move",icon:"🚲",t:"60 minutes of active play",q:"active games for kids indoor outdoor",s:20},
    {id:"e4",p:"move",icon:"⚽",t:"Sports practice",s:20},
    {id:"e5",p:"family",icon:"🎲",t:"Family game night",s:15},
    {id:"e6",p:"family",icon:"📞",t:"Call grandma or grandpa",s:10},
    {id:"e7",p:"learn",icon:"📚",t:"Read for 20 minutes",s:15},
    {id:"e8",p:"learn",icon:"➗",t:"Math practice",s:10},
    {id:"e9",p:"rest",icon:"🍽️",t:"Screen-free dinner",s:10}],
  trail:[
    {id:"t1",p:"eat",icon:"🍳",t:"Cook a simple meal",q:"easy healthy recipes for teens to cook",s:20},
    {id:"t2",p:"eat",icon:"🍎",t:"Healthy snacks all day",s:10},
    {id:"t3",p:"move",icon:"🏃",t:"Run or walk 2 miles",q:"running tips for beginner teens",s:20},
    {id:"t4",p:"move",icon:"🏀",t:"Team practice",s:20},
    {id:"t5",p:"family",icon:"🗺️",t:"Plan a family outing",s:15},
    {id:"t6",p:"family",icon:"🙌",t:"Help a neighbor",s:15},
    {id:"t7",p:"learn",icon:"🎸",t:"Practice a new skill 30 min",q:"how to practice a new skill deliberate practice",s:15},
    {id:"t8",p:"learn",icon:"📘",t:"Read a chapter of your book",s:10},
    {id:"t9",p:"rest",icon:"📵",t:"Screen-free hour",q:"fun things to do without screens for kids",s:15},
    {id:"t10",p:"rest",icon:"🔌",t:"Phone charges outside bedroom",s:10}]
};
const BADGES=[
  {id:"first",icon:"⭐",n:"First Star",test:k=>k.lifetime>0},
  {id:"veg",icon:"🥦",n:"Veggie Explorer",test:k=>(k.pillar.eat||0)>=3},
  {id:"move",icon:"🏅",n:"Mover",test:k=>(k.pillar.move||0)>=3},
  {id:"fam",icon:"💛",n:"Family Hero",test:k=>(k.pillar.family||0)>=3},

/* ---------- KID VIEWS ---------- */
function header(k){
  const b=BANDS[k.band];
  const doneToday=Object.values(S.today[k.id]||{}).filter(v=>v==="done").length;
  return `<div class="hello"><div class="chip" style="padding:0;border:0;background:none"><span class="av" style="width:52px;height:52px;font-size:30px">${k.av}</span></div>
    <div><h2>Hi ${k.name}!</h2><p>${b.name} · ${doneToday} done today${mult(k)>1?` · ${mult(k)}x streak bonus`:""}</p></div></div>
  <div class="stats"><div class="stat stars"><b>${k.stars}</b><span>Stars</span></div><div class="stat streak"><b>${k.streak}🔥</b><span>Day streak</span></div><div class="stat goal"><b>${Math.round(S.goal.have/S.goal.target*100)}%</b><span>Family goal</span></div></div>`;
}
function stateLabel(k,st){
  if(st==="done")return "✓ Done";
  if(st==="pending")return "Waiting";
  return k.band==="trail"?"I did it":"Done!";
}
function viewToday(k){
  const st=S.today[k.id]||{};
  if(k.band==="sprout"){
    const grown=Object.values(st).filter(v=>v==="done").length;
    const sprout=["🌰","🌱","🌿","🪴","🌳","🌳"][Math.min(grown,5)];
    return header(k)+daily(k)+`
    <div class="card pet"><div class="sprout" id="sprout" aria-hidden="true">${sprout}</div>
      <div class="grow" style="flex:1"><b style="font-family:var(--display);font-size:18px">Sunny the sprout</b>
      <p class="note">Sunny grows each time ${k.name} does a healthy thing. Ask a grown-up to tap “Done!” with you.</p>
      <div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,grown/5*100)}%"></i></div></div></div>
    <div class="section-title"><h3>Today’s fun</h3><span>Tap 🔊 to hear it</span></div>
    <div class="tiles">${acts(k).map(a=>`<div class="tile p-${a.p} ${st[a.id]||""}">
      ${st[a.id]?`<span class="badge">${st[a.id]==="done"?"⭐ Yay!":"⏳"}</span>`:""}
      <span class="big" aria-hidden="true">${a.icon}</span>${esc(a.t)}<span class="st">+${a.s} ⭐</span>
      <div class="row"><button class="speak" data-say="${esc(a.t)}" aria-label="Read aloud: ${esc(a.t)}">🔊</button>${vidLink(a)}
      <button class="qbtn ${st[a.id]||""}" data-act="${a.id}" ${st[a.id]?"disabled":""}>${stateLabel(k,st[a.id])}</button></div></div>`).join("")}</div>
    <p class="demo">For ages 2–5 a grown-up confirms each one in the Parent view.</p>`;
  }
  const list=acts(k).filter(a=>S.filter==="all"||a.p===S.filter);
  const total=acts(k).length,done=Object.values(st).filter(v=>v==="done").length;
  return header(k)+daily(k)+`
  <div class="card"><div class="section-title"><h3>Today’s quests</h3><span>${done} of ${total}</span></div>
    <div class="bar" style="margin-top:10px"><i style="width:${done/total*100}%"></i></div>
    ${k.band==="trail"?`<p class="note" style="margin-top:10px">You log your own quests. Parents can spot-check.</p>`:`<p class="note" style="margin-top:10px">Tap Done and a parent will give you your Stars.</p>`}</div>
  <div class="pillars" role="group" aria-label="Filter by habit"><button class="pfilter" data-f="all" aria-pressed="${S.filter==="all"}">All</button>
    ${Object.entries(PILLARS).map(([id,p])=>`<button class="pfilter" data-f="${id}" aria-pressed="${S.filter===id}">${p.icon} ${p.name}</button>`).join("")}</div>
  <div class="quests">${list.map(a=>`<div class="quest"><div class="ic p-${a.p}" aria-hidden="true">${a.icon}</div>
    <div class="txt"><b>${esc(a.t)}</b><small>${PILLARS[a.p].name} · +${Math.round(a.s*mult(k))} ⭐</small></div>
    ${vidLink(a)}<button class="qbtn ${st[a.id]||""}" data-act="${a.id}" ${st[a.id]?"disabled":""}>${stateLabel(k,st[a.id])}</button></div>`).join("")}</div>`;
}
function viewWatch(k){
  const byP={};acts(k).forEach(a=>(byP[a.p]=byP[a.p]||[]).push(a));
  const vrow=(icon,title,sub,v,cls="")=>{const p=v.key&&pick(v.key);if(p)sub=p.t+(p.ok||p.custom?" · ✓ Parent approved":"");return `<a class="vrow" href="${slotUrl(v)}" target="_blank" rel="noopener"><span class="ic ${cls}" aria-hidden="true">${icon}</span><span style="flex:1;min-width:0"><b style="display:block">${esc(title)}</b><small style="color:var(--muted);font-weight:700;font-size:12px">${esc(sub)}</small></span><span class="play">▶ Watch</span></a>`};
  return `<div><h2 style="font-size:24px">Watch and learn</h2><p class="note">Videos picked for ${k.name}’s sports and age, plus a how-to for every activity.</p></div>
  <div class="card"><div class="section-title"><h3>🏆 My sports</h3><span>Tap to pick</span></div>
    <div class="pillars" style="margin-top:10px" role="group" aria-label="Pick favorite sports">${Object.entries(SPORTS).map(([id,sp])=>`<button class="pfilter" data-sport="${id}" aria-pressed="${k.sports.includes(id)}">${sp.i} ${sp.n}</button>`).join("")}</div></div>
  ${k.sports.length?k.sports.map(id=>`<div class="section-title"><h3>${SPORTS[id].i} ${SPORTS[id].n}</h3></div>
    <div class="vlist">${sportVids(id,k.band).map(v=>vrow(SPORTS[id].i,v.k,v.d,v,"p-move")).join("")}</div>`).join(""):`<p class="empty">Pick a sport above to get videos for it.</p>`}
  <div class="section-title"><h3>🌟 Learn good things</h3><span>Kid-friendly channels</span></div>
  <div class="vlist">${LEARN[k.band].map(v=>vrow(v.i,v.t,v.ch,v,"p-learn")).join("")}</div>
  <div class="section-title"><h3>🎬 How to do today’s activities</h3></div>
  ${Object.entries(byP).map(([p,list])=>`<div class="section-title"><h3 style="font-size:15px;color:var(--muted)">${PILLARS[p].icon} ${PILLARS[p].name}</h3></div>
  <div class="vlist">${list.map(a=>`<a class="vrow" href="${vidUrl(a)}" target="_blank" rel="noopener"><span class="ic p-${a.p}" aria-hidden="true">${a.icon}</span><b>${esc(a.t)}</b><span class="play">▶ Watch</span></a>`).join("")}</div>`).join("")}
  <p class="demo">Prototype links open a YouTube search. In the real app, parents approve a hand-picked, kid-safe video for each one.</p>`;
}
function viewShop(k){
  const mine=S.requests.filter(r=>r.kid===k.id);
  return `<div class="section-title"><h3>Family reward shop</h3><span class="cost">${k.stars} ⭐ to spend</span></div>
  <div class="shop">${S.rewards.map(r=>{const asked=mine.find(q=>q.reward===r.id&&q.state==="asked");
    return `<div class="reward"><span class="big" aria-hidden="true">${r.icon}</span><b>${esc(r.t)}</b><span class="cost">${r.c} ⭐</span>
    <button class="rbtn" data-buy="${r.id}" ${asked||k.stars<r.c?"disabled":""}>${asked?"Asked a parent":k.stars<r.c?`${r.c-k.stars} more ⭐`:"Get it"}</button></div>`}).join("")}</div>
  <div class="card"><div class="section-title"><h3>🏞️ ${esc(S.goal.t)}</h3><span>${S.goal.have} / ${S.goal.target} ⭐</span></div>
    <div class="bar sky" style="margin-top:10px"><i style="width:${S.goal.have/S.goal.target*100}%"></i></div>
    <p class="note" style="margin-top:8px">Every Star anyone in the family earns also counts toward this goal.</p></div>`;
}
function viewMe(k){
  const max=Math.max(1,...Object.values(k.pillar));
  return `<div class="hello"><span class="av" style="width:64px;height:64px;font-size:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2)">${k.av}</span>
    <div><h2>${k.name}</h2><p>${BANDS[k.band].name} (ages ${BANDS[k.band].ages}) · ${k.lifetime} Stars all time</p></div></div>
  <div class="card"><div class="section-title"><h3>Badges</h3><span>${BADGES.filter(b=>b.test(k)).length} of ${BADGES.length}</span></div>
    <div class="badges" style="margin-top:12px">${BADGES.map(b=>`<div class="bdg ${b.test(k)?"on":""}"><span class="m" aria-hidden="true">${b.icon}</span>${b.n}</div>`).join("")}</div></div>
  <div class="card"><div class="section-title"><h3>My habits this week</h3></div>
    <div class="list" style="margin-top:10px">${Object.entries(PILLARS).map(([id,p])=>`<div class="mini"><span>${p.icon} ${p.name.split(" ")[0]}</span><div class="bar"><i style="width:${(k.pillar[id]||0)/max*100}%"></i></div><em>${k.pillar[id]||0}</em></div>`).join("")}</div></div>`;
}
function bindKid(k){
  bindDaily(k);
  document.querySelectorAll("[data-sport]").forEach(b=>b.onclick=()=>{const id=b.dataset.sport;k.sports=k.sports.includes(id)?k.sports.filter(x=>x!==id):[...k.sports,id];save();render()});
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;save();render()});
  document.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say));
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
    const a=actById(b.dataset.act);S.today[k.id]=S.today[k.id]||{};
    if(k.band==="trail"){S.today[k.id][a.id]="done";const p=award(k,a);burst(b);toast(`+${p} Stars! Nice work, ${k.name}.`)}
    else{S.today[k.id][a.id]="pending";burst(b);toast(k.band==="sprout"?"Yay! A grown-up will give you your Stars.":"Sent to a parent for Stars!");if(k.band==="sprout")say("Great job, "+k.name+"!")}
    save();render();
  });
  document.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{
    const r=rewardById(b.dataset.buy);if(k.stars<r.c)return;
    S.requests.push({id:"q"+Date.now(),kid:k.id,reward:r.id,state:"asked"});burst(b);toast("Asked a parent for: "+r.t);save();render();
  });
}

/* ---------- PARENT VIEWS ---------- */
function viewApprove(){
  const items=[];for(const id in S.today)for(const a in S.today[id])if(S.today[id][a]==="pending")items.push([id,a]);
  const reqs=S.requests.filter(r=>r.state==="asked");
  return `<div><h2 style="font-size:24px">Good evening</h2><p class="note">Confirm what your kids did today. Stars go to them right away.</p></div>
  <div class="card"><div class="section-title"><h3>Activities</h3><span>${items.length} waiting</span></div>
    <div class="list">${items.length?items.map(([id,aid])=>{const k=kid(id),a=actById(aid);return `<div class="appr"><div class="ic p-${a.p}" style="width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none" aria-hidden="true">${a.icon}</div>
      <div class="grow"><div class="who">${k.av} ${k.name}</div><b style="font-size:15px">${esc(a.t)}</b></div>
      <button class="no" data-deny="${id}|${aid}">Not yet</button><button class="ok" data-approve="${id}|${aid}">+${Math.round(a.s*mult(k))} ⭐</button></div>`}).join(""):`<p class="empty">All caught up. Switch to Mia or Leo and tap Done on a quest to see it here.</p>`}</div></div>
  <div class="card"><div class="section-title"><h3>Reward requests</h3><span>${reqs.length} waiting</span></div>
    <div class="list">${reqs.length?reqs.map(q=>{const k=kid(q.kid),r=rewardById(q.reward);return `<div class="appr"><span style="font-size:28px" aria-hidden="true">${r.icon}</span>
      <div class="grow"><div class="who">${k.av} ${k.name} · has ${k.stars} ⭐</div><b style="font-size:15px">${esc(r.t)}</b></div>
      <button class="no" data-rdeny="${q.id}">Later</button><button class="ok" data-rok="${q.id}">Give it (−${r.c})</button></div>`}).join(""):`<p class="empty">No requests right now.</p>`}</div></div>`;
}
let VEDIT=null;
function viewVideos(){
  const row=(key,icon,label)=>{const p=pick(key);if(!p)return "";const st=p.custom?"Your pick":p.ok?"Approved":"Needs review";
    return `<div class="vslot"><div class="row"><span style="font-size:24px" aria-hidden="true">${icon}</span><div class="grow"><b>${esc(label)}</b><a class="vt" href="${ytw(p.id)}" target="_blank" rel="noopener">▶ ${esc(p.t)}</a></div><span class="tag st-${st.replace(/ /g,"").toLowerCase()}">${st}</span></div>
    ${VEDIT===key?`<form class="addform" data-vform="${key}" style="margin-top:8px"><input id="vin" placeholder="Paste a YouTube link" required><button class="ok" type="submit">Save</button></form>`:
    `<div class="row" style="justify-content:flex-end;gap:6px;margin-top:6px">${p.ok||p.custom?"":`<button class="ok" data-vok="${key}">Approve</button>`}<button class="no" data-vedit="${key}">Replace</button>${p.custom?`<button class="no" data-vreset="${key}">Use suggestion</button>`:""}</div>`}</div>`};
  const sports=Object.entries(SPORTS).map(([id,sp])=>row("sport:"+id,sp.i,sp.n+" skills")).join("");
  const learn=Object.entries(BANDS).map(([b,band])=>`<h4 class="vh">${band.name} (${band.ages})</h4>`+LEARN[b].map(v=>row(v.key,v.i,v.t)).join("")).join("");
  const n=Object.keys(PICKS).length,ok=Object.keys(PICKS).filter(k=>{const p=pick(k);return p.ok||p.custom}).length;
  return `<div><h2 style="font-size:24px">Video library</h2><p class="note">Every video kids see is picked ahead of time. Watch each one, then approve it or paste a link to a better one.</p></div>
  <div class="card"><div class="section-title"><h3>Reviewed</h3><span>${ok} of ${n}</span></div><div class="bar" style="margin-top:10px"><i style="width:${ok/n*100}%"></i></div></div>
  <div class="card"><h3 style="font-size:18px">🏆 Sports skills</h3><div class="list" style="margin-top:6px">${sports}</div></div>
  <div class="card"><h3 style="font-size:18px">🌟 Learn good things</h3><div class="list" style="margin-top:6px">${learn}</div></div>
  <p class="demo">Suggested videos were found with a web search and still need a grown-up to watch them. Slots without a pick use a YouTube search for now.</p>`;
}
function viewRewards(){
  return `<div><h2 style="font-size:24px">Rewards</h2><p class="note">You decide what Stars can buy. Real-world treats and time together work best.</p></div>
  <div class="card"><div class="list">${S.rewards.map(r=>`<div class="appr"><span style="font-size:26px" aria-hidden="true">${r.icon}</span><b class="grow" style="font-size:15px">${esc(r.t)}</b>
    <div class="price"><button data-dec="${r.id}" aria-label="Lower price">−</button><span>${r.c} ⭐</span><button data-inc="${r.id}" aria-label="Raise price">+</button></div></div>`).join("")}</div></div>
  <div class="card"><h3 style="font-size:18px;margin-bottom:10px">Add a reward</h3>
    <form class="addform" id="addr"><input id="rname" placeholder="e.g. Bake cookies together" required maxlength="48"><input id="rcost" type="number" min="5" max="1000" step="5" value="60" aria-label="Price in Stars"><button class="ok" type="submit">Add</button></form></div>
  <div class="card"><div class="section-title"><h3>Family goal</h3><span>${S.goal.have} / ${S.goal.target} ⭐</span></div>
    <p class="note" style="margin-top:4px">${esc(S.goal.t)}</p><div class="bar sky" style="margin-top:10px"><i style="width:${S.goal.have/S.goal.target*100}%"></i></div></div>`;
}
function viewFamily(){
  return `<div><h2 style="font-size:24px">This week</h2><p class="note">Sample weekly summary. In the real app this arrives every Sunday.</p></div>
  <div class="card">${S.kids.map(k=>{const max=Math.max(1,...Object.values(k.pillar));return `<div class="kidsum">
    <div class="row"><span style="font-size:26px" aria-hidden="true">${k.av}</span><div class="grow"><b>${k.name}, ${k.age}</b> <span class="tag">${BANDS[k.band].name}</span></div><span class="cost">${k.stars} ⭐</span></div>
    ${Object.entries(PILLARS).map(([id,p])=>`<div class="mini"><span>${p.icon} ${p.name.split(" ")[0]}</span><div class="bar"><i style="width:${(k.pillar[id]||0)/max*100}%"></i></div><em>${k.pillar[id]||0}</em></div>`).join("")}
    <p class="note">${tip(k)}</p></div>`}).join("")}</div>
  <div class="card"><h3 style="font-size:18px">Privacy</h3><p class="note" style="margin-top:6px">No ads, no chat with strangers, no tracking. Kid profiles use a first name and an avatar only. In the real app you can export or delete all family data from here.</p></div>`;
}
function tip(k){const e=Object.entries(PILLARS).map(([id])=>[id,k.pillar[id]||0]).sort((a,b)=>a[1]-b[1])[0];
  return `Idea: ${k.name} did the least in “${PILLARS[e[0]].name}”. Try doing one together this weekend.`}
function bindParent(){
  S.vids=S.vids||{};
  document.querySelectorAll("[data-vok]").forEach(b=>b.onclick=()=>{S.vids[b.dataset.vok]={ok:true};toast("Approved");save();render()});
  document.querySelectorAll("[data-vedit]").forEach(b=>b.onclick=()=>{VEDIT=b.dataset.vedit;render();const i=$("#vin");if(i)i.focus()});
  document.querySelectorAll("[data-vreset]").forEach(b=>b.onclick=()=>{delete S.vids[b.dataset.vreset];toast("Back to the suggested video");save();render()});
  document.querySelectorAll("[data-vform]").forEach(f=>f.onsubmit=e=>{e.preventDefault();const v=$("#vin").value.trim();
    const m=v.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/)||v.match(/^([\w-]{11})$/);
    if(!m){toast("That doesn’t look like a YouTube link");return}
    S.vids[f.dataset.vform]={id:m[1],t:"Your pick ("+m[1]+")",ok:true};VEDIT=null;toast("Saved. Kids will see this video.");save();render()});
  document.querySelectorAll("[data-approve]").forEach(b=>b.onclick=()=>{const [id,aid]=b.dataset.approve.split("|");const k=kid(id);S.today[id][aid]="done";const p=award(k,actById(aid));burst(b);toast(`${k.name} got ${p} Stars`);save();render()});
  document.querySelectorAll("[data-deny]").forEach(b=>b.onclick=()=>{const [id,aid]=b.dataset.deny.split("|");delete S.today[id][aid];toast("Moved back to the quest list");save();render()});
  document.querySelectorAll("[data-rok]").forEach(b=>b.onclick=()=>{const q=S.requests.find(x=>x.id===b.dataset.rok),k=kid(q.kid),r=rewardById(q.reward);
    if(k.stars<r.c){toast(`${k.name} needs ${r.c-k.stars} more Stars`);return}k.stars-=r.c;q.state="given";burst(b);toast(`${r.t} for ${k.name}!`);save();render()});
  document.querySelectorAll("[data-rdeny]").forEach(b=>b.onclick=()=>{S.requests.find(x=>x.id===b.dataset.rdeny).state="later";toast("Saved for later");save();render()});
  document.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>{const r=rewardById(b.dataset.inc);r.c=Math.min(1000,r.c+10);save();render()});
  document.querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>{const r=rewardById(b.dataset.dec);r.c=Math.max(10,r.c-10);save();render()});
  const f=$("#addr");if(f)f.onsubmit=e=>{e.preventDefault();const n=$("#rname").value.trim(),c=parseInt($("#rcost").value,10)||60;if(!n)return;
    S.rewards.push({id:"r"+Date.now(),icon:"🎁",t:n,c:Math.max(5,Math.min(1000,c))});toast("Reward added to the shop");save();render()};
}
// In-app player: videos with a known id play in an embedded YouTube player (no related videos from other channels)
function openPlayer(id,title,url){$("#ptitle").textContent=title||"Video";$("#pout").href=url;
  $("#pframe").src="https://www.youtube-nocookie.com/embed/"+id+"?autoplay=1&playsinline=1&rel=0&modestbranding=1";$("#player").hidden=false}
function closePlayer(){$("#pframe").src="about:blank";$("#player").hidden=true}
$("#pclose").onclick=closePlayer;$("#player").onclick=e=>{if(e.target.id==="player")closePlayer()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#player").hidden)closePlayer()});
document.addEventListener("click",e=>{const a=e.target.closest("a[href*='youtube.com/watch?v=']");if(!a)return;
  const id=new URL(a.href).searchParams.get("v");if(!id)return;e.preventDefault();
  const t=(a.querySelector("small")&&a.querySelector("small").textContent.split(" · ")[0])||a.textContent.replace("▶","").trim()||a.getAttribute("aria-label");
  openPlayer(id,t,a.href)});
let armed=false;
$("#reset").onclick=()=>{const b=$("#reset");if(!armed){armed=true;b.textContent="Tap again to reset";setTimeout(()=>{armed=false;b.textContent="Reset demo"},2500);return}
  S=seed();save();armed=false;b.textContent="Reset demo";render();toast("Demo reset")};
render();
</script>

</body>
</html>
