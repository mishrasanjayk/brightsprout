<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="BrightSprout">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>BrightSprout</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: a single phone-width app column, sticky header with profile switcher, fixed bottom tab bar */
:root{
  --bg:#F3F7F1; --surface:#FFFFFF; --surface-2:#E8F0E4; --ink:#1F2B24; --muted:#5E6E64; --line:#D5E1D0;
  --leaf:#2F9E5B; --leaf-ink:#FFFFFF; --sun:#F5B731; --sun-soft:#FFF1C9; --sky:#3A8FD9; --berry:#E2576B; --plum:#7E5BD6;
  --star:#E89B0C; --shadow:0 2px 0 rgba(31,43,36,.08);
  --display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111814; --surface:#1A231E; --surface-2:#223029; --ink:#E9F1EA; --muted:#9DB0A3; --line:#2E3D35;
  --leaf:#4CC27C; --leaf-ink:#0D1A12; --sun:#F7C64F; --sun-soft:#3A3117; --sky:#64A9E8; --berry:#F07A8B; --plum:#A88BF0;
  --star:#F7C64F; --shadow:0 2px 0 rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111814; --surface:#1A231E; --surface-2:#223029; --ink:#E9F1EA; --muted:#9DB0A3; --line:#2E3D35;
  --leaf:#4CC27C; --leaf-ink:#0D1A12; --sun:#F7C64F; --sun-soft:#3A3117; --sky:#64A9E8; --berry:#F07A8B; --plum:#A88BF0;
  --star:#F7C64F; --shadow:0 2px 0 rgba(0,0,0,.3); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
html{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:600}
.app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{font-size:22px;color:var(--leaf);display:flex;align-items:center;gap:6px}
.brand small{font-family:var(--body);color:var(--muted);font-size:12px;font-weight:700}
.slogan{margin:2px 0 0;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.reset{white-space:nowrap;font-size:12px;color:var(--muted);font-weight:700;padding:6px 8px}
.profiles{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.profiles::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--surface);border:2px solid var(--line);white-space:nowrap;font-weight:700;font-size:14px}
.chip .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:var(--surface-2)}
.chip[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf);color:var(--leaf-ink)}
.chip[aria-pressed="true"] .av{background:rgba(255,255,255,.25)}
.chip .age{font-weight:600;opacity:.75;font-size:12px}
main{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 110px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.hello{display:flex;gap:12px;align-items:center}
.hello h2{font-size:24px}
.hello p{margin:2px 0 0;color:var(--muted);font-weight:600;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.stat.stars b{color:var(--star)} .stat.streak b{color:var(--berry)} .stat.goal b{color:var(--sky)}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.section-title h3{font-size:18px}
.section-title span{color:var(--muted);font-size:13px;font-weight:700}
.pillars{display:flex;gap:6px;flex-wrap:wrap}
.pfilter{padding:6px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.pfilter[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.quests{display:flex;flex-direction:column;gap:10px}
.quest{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.quest .ic{width:48px;height:48px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:26px}
.quest .txt{flex:1;min-width:0}
.quest .txt b{display:block;font-size:15px;line-height:1.25}
.quest .txt small{color:var(--muted);font-weight:700;font-size:12px}
.qbtn{flex:none;min-width:76px;padding:10px 12px;border-radius:14px;font-weight:800;font-size:14px;background:var(--leaf);color:var(--leaf-ink)}
.qbtn.pending{background:var(--sun-soft);color:var(--ink)}
.qbtn.done{background:var(--surface-2);color:var(--leaf)}
.qbtn:disabled{cursor:default}
.p-eat{background:#E4F5DA} .p-move{background:#DCEBFA} .p-family{background:#FBE1E5} .p-learn{background:#ECE4FB} .p-rest{background:#FFF1C9}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .p-eat{background:#24402C}:root:not([data-theme="light"]) .p-move{background:#1F3448}:root:not([data-theme="light"]) .p-family{background:#47262C}:root:not([data-theme="light"]) .p-learn{background:#30284A}:root:not([data-theme="light"]) .p-rest{background:#3A3117}}
:root[data-theme="dark"] .p-eat{background:#24402C}:root[data-theme="dark"] .p-move{background:#1F3448}:root[data-theme="dark"] .p-family{background:#47262C}:root[data-theme="dark"] .p-learn{background:#30284A}:root[data-theme="dark"] .p-rest{background:#3A3117}
/* Little Sprouts big tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:24px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:3px solid transparent;font-weight:800;font-size:15px;position:relative}
.tile .big{font-size:48px;line-height:1}
.tile .st{font-size:13px;color:var(--muted);font-weight:800}
.tile.pending{border-color:var(--sun)} .tile.done{border-color:var(--leaf)}
.tile .badge{position:absolute;top:8px;right:8px;font-size:12px;background:var(--surface);border-radius:999px;padding:2px 8px;font-weight:800}
.pet{display:flex;align-items:center;gap:14px}
.pet .sprout{font-size:56px;line-height:1;transition:transform .4s}
.bar{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:999px;transition:width .5s}
.bar.sky i{background:var(--sky)} .bar.sun i{background:var(--sun)}
.speak{font-size:13px;font-weight:800;color:var(--sky);padding:4px 0}
/* shop */
.shop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.reward{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.reward .big{font-size:34px}
.reward b{font-size:14px;line-height:1.25;flex:1}
.cost{font-weight:800;color:var(--star);font-variant-numeric:tabular-nums}
.rbtn{padding:8px;border-radius:12px;font-weight:800;font-size:13px;background:var(--sun);color:#3A2A00}
.rbtn:disabled{background:var(--surface-2);color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bdg{text-align:center;font-size:11px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;gap:4px;align-items:center}
.bdg .m{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--surface-2);filter:grayscale(1);opacity:.45}
.bdg.on{color:var(--ink)} .bdg.on .m{filter:none;opacity:1;background:var(--sun-soft);box-shadow:0 0 0 3px var(--sun) inset}
/* parent */
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.list{display:flex;flex-direction:column;gap:10px}
.appr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.appr:last-child{border-bottom:0}
.appr .who{font-size:12px;color:var(--muted);font-weight:800}
.ok{background:var(--leaf);color:var(--leaf-ink);padding:8px 12px;border-radius:12px;font-weight:800;font-size:13px}
.no{background:var(--surface-2);padding:8px 10px;border-radius:12px;font-weight:800;font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-weight:600;text-align:center;padding:12px 0;font-size:14px}
.price{display:flex;align-items:center;gap:6px}
.price button{width:32px;height:32px;border-radius:10px;background:var(--surface-2);font-weight:800}
.price span{min-width:44px;text-align:center;font-weight:800;color:var(--star);font-variant-numeric:tabular-nums}
.addform{display:flex;gap:8px;flex-wrap:wrap}
.addform input{flex:1 1 160px;min-width:0;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
.addform input[type=number]{flex:0 0 84px}
.kidsum{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.kidsum:last-child{border-bottom:0}
.mini{display:grid;grid-template-columns:70px 1fr 34px;gap:8px;align-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.mini em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);line-height:1.45;margin:0}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav .in{max-width:460px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav button{padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--muted);position:relative}
nav button .i{font-size:22px;line-height:1}
nav button[aria-current="page"]{color:var(--leaf)}
nav .dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:999px;background:var(--berry);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;transition:.25s;z-index:60;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.burst{position:fixed;pointer-events:none;z-index:30;font-size:22px;animation:fly .9s ease-out forwards}
@keyframes fly{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.2);opacity:0}}
@media (prefers-reduced-motion: reduce){.burst{display:none}.toast,.bar i,.pet .sprout{transition:none}}
.vid{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--berry);color:#fff;text-decoration:none;font-size:15px;font-weight:800}
.vlist{display:flex;flex-direction:column;gap:8px}
.vrow{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}
.vrow .ic{width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:24px}
.vrow b{flex:1;min-width:0;font-size:15px;line-height:1.25}
.vrow .play{flex:none;background:var(--berry);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800}
.daily{border:2px solid var(--sun)}
.dstep{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.dstep:last-of-type{border-bottom:0}
.dnum{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sun-soft);font-weight:800;font-size:13px}
.dstep.done .dnum{background:var(--leaf);color:var(--leaf-ink)}
.dic{font-size:26px;flex:none}
.dstep .txt{flex:1;min-width:0}.dstep .txt b{display:block;font-size:15px;line-height:1.25}.dstep .txt small{color:var(--muted);font-weight:700;font-size:12px}
.dact{display:flex;gap:6px;flex:none}.dact .qbtn{min-width:0}
.qq{font-family:var(--display);font-size:20px;font-weight:600;margin:12px 0;line-height:1.3}
.opts{display:flex;flex-direction:column;gap:8px}.opts.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{text-align:left;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-weight:800;font-size:15px}
.opts.big .opt{text-align:center;font-size:22px;padding:18px 8px}
.opt.right{border-color:var(--leaf);background:var(--surface-2);color:var(--leaf)}.opt.wrong{border-color:var(--berry);color:var(--berry)}
.opt:disabled{cursor:default}
.why{margin-top:12px;padding:12px;border-radius:14px;background:var(--sun-soft);font-size:14px;line-height:1.45}.why.good{background:var(--surface-2)}
.vslot{padding:10px 0;border-bottom:1px solid var(--line)}.vslot:last-child{border-bottom:0}
.vslot b{display:block;font-size:14px}
.vt{display:block;font-size:12px;font-weight:700;color:var(--sky);text-decoration:none;margin-top:2px;line-height:1.35}
.vh{margin:12px 0 0;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tag.st-approved,.tag.st-yourpick{background:var(--surface-2);color:var(--leaf)}.tag.st-needsreview{background:var(--sun-soft);color:var(--ink)}
.sheet[hidden]{display:none!important}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,20,14,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{width:100%;max-width:460px;background:var(--surface);border-radius:24px 24px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.frame{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:#000}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pbtn{display:block;width:100%;text-align:left;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-weight:800;font-size:16px;cursor:pointer}
.proof{display:flex;flex-direction:column;gap:6px;align-items:flex-end;margin:-4px 0 8px}
.proof video,.proof img{width:100%;max-height:220px;border-radius:12px;background:#000;object-fit:contain}
.proofnote{margin:-6px 0 8px}
.subopts{display:flex;flex-direction:column;gap:8px;margin-left:32px;padding:10px 12px;border-radius:14px;background:var(--surface-2)}
.subopts b{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tgl{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:700;line-height:1.35;cursor:pointer}
.tgl input{width:22px;height:22px;flex:none;accent-color:var(--leaf);margin:0}
/* Playful kid styling */
body.kidmode{background-color:var(--bg);background-image:radial-gradient(color-mix(in srgb,var(--kc) 14%,transparent) 1.5px,transparent 1.6px);background-size:22px 22px}
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:18px 16px;border-radius:24px;color:#fff;
  background:linear-gradient(135deg,var(--kc),color-mix(in srgb,var(--kc) 55%,#1F2B24));box-shadow:0 6px 0 color-mix(in srgb,var(--kc) 60%,#000)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero::before{content:"";position:absolute;right:50px;bottom:-60px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero-av{flex:none;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:44px;background:rgba(255,255,255,.25);animation:bob 3s ease-in-out infinite;z-index:1}
.hero-art{font-size:56px;flex:none;z-index:1;animation:bob 3s ease-in-out infinite}
.hero-txt{flex:1;min-width:0;z-index:1}
.hero h2{font-size:26px;color:#fff}.hero p{margin:2px 0 0;font-weight:700;font-size:14px;opacity:.95}
.eyebrow{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;background:rgba(255,255,255,.25);padding:3px 8px;border-radius:999px;margin-bottom:4px}
.xp{height:10px;border-radius:999px;background:rgba(255,255,255,.3);margin-top:8px;overflow:hidden}.xp i{display:block;height:100%;background:#FFE27A;border-radius:999px}
.xpl{font-size:11px;font-weight:800;opacity:.9}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.qbtn,.ok,.rbtn{box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s}
.qbtn:active,.ok:active,.rbtn:active,.subj:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.stat{border-width:2px}.stat.stars{background:var(--sun-soft)}
.tip{display:flex;gap:10px;align-items:flex-start}
.tip-m{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--surface);border:2px solid var(--line)}
.tip p{margin:0;position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;border-top-left-radius:4px;padding:10px 12px;font-size:14px;line-height:1.4;font-weight:600}
.subjects{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.subj{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px;border-radius:22px;color:#fff;text-align:left;
  background:linear-gradient(150deg,var(--sc),color-mix(in srgb,var(--sc) 65%,#000));box-shadow:0 5px 0 color-mix(in srgb,var(--sc) 55%,#000);transition:transform .08s,box-shadow .08s}
.subj .si{font-size:34px;line-height:1}.subj b{font-family:var(--display);font-size:20px;font-weight:600}.subj small{font-weight:800;font-size:12px;opacity:.9}
.hw{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}.hw:last-child{border-bottom:0}
.hw .hwi{font-size:26px;flex:none}.hw b{display:block;font-size:15px;line-height:1.25}.hw small{color:var(--muted);font-weight:700;font-size:12px}
.hw.done b{color:var(--muted)}
.addform select,.setrow select{padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:15px;max-width:100%}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800}

const GRADE_NAMES={"-1":"Pre-K","0":"Kindergarten","1":"1st grade","2":"2nd grade","3":"3rd grade","4":"4th grade","5":"5th grade","6":"6th grade","7":"7th grade","8":"8th grade","9":"9th grade"};
const gradeOf=k=>k.grade!==undefined?k.grade:Math.max(-1,Math.min(9,k.age-5));
const lvl=g=>g<=0?0:g<=2?1:g<=5?2:3;
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function mkQ(q,right,wrongs,why){const w=[...new Set(wrongs.map(String))].filter(x=>x!==String(right)).slice(0,3);const opts=shuffle([String(right),...w]);return {q,opts,a:opts.indexOf(String(right)),why}}
const near=(n,spread=3)=>{const s=new Set();for(let t=0;s.size<3&&t<60;t++){const d=ri(-spread,spread);if(d&&n+d>0)s.add(n+d)}return [...s]};

// MATH: generated fresh every time, following Common Core grade topics
function genMath(g){
  const t=ri(0,2);
  if(g<=0){
    if(t===0){const n=ri(2,8),e=["🍎","⭐","🐟","🎈"][ri(0,3)];return mkQ(`How many? ${e.repeat(n)}`,n,near(n,2),`Count them one by one: there are ${n}.`)}
    if(t===1){const a=ri(1,9),b=ri(1,9);if(a===b)return genMath(g);return mkQ(`Which number is bigger: ${a} or ${b}?`,Math.max(a,b),[Math.min(a,b)],`${Math.max(a,b)} comes later when you count, so it is bigger.`)}
    const a=ri(1,4),b=ri(1,4);return mkQ(`${a} + ${b} = ?`,a+b,near(a+b,2),`Hold up ${a} fingers, then ${b} more. That makes ${a+b}.`)}
  if(g===1){const a=ri(3,12),b=ri(1,8);return t?mkQ(`${a+b} − ${b} = ?`,a,near(a),`Count back ${b} from ${a+b} and you land on ${a}.`):mkQ(`${a} + ${b} = ?`,a+b,near(a+b),`${a} and ${b} more makes ${a+b}.`)}
  if(g===2){
    if(t===2){const s=[2,5,10][ri(0,2)],st=s*ri(1,5);return mkQ(`Skip count by ${s}s: ${st}, ${st+s}, ${st+2*s}, ___`,st+3*s,[st+3*s+1,st+2*s+1,st+4*s],`Add ${s} each time: ${st+2*s} + ${s} = ${st+3*s}.`)}

async function doSignin(btn){const em=$("#iemail").value,pw=$("#ipw").value;
  if(!sameEmail(em,S.settings.email)&&!sameEmail(em,S.settings.pendingEmail)){toast("That email doesn't match this family");return}
  if(!pw){toast("Please type your password");return}
  btn.disabled=true;const ok=await checkPw(pw);btn.disabled=false;

async function saveEmail(btn){const em=$("#nemail").value.trim(),pw=$("#epw").value;
  if(!okEmail(em)){toast("Please type the new email");return}if(sameEmail(em,S.settings.email)){toast("That's already your email");return}
  btn.disabled=true;
  try{if(!(await pwMatches(pw))){toast("Password isn't right");return}
    if(authOn()&&S.settings.authLinked){const tok=await fbSignIn(pw);await fb("sendOobCode",{requestType:"VERIFY_AND_CHANGE_EMAIL",idToken:tok,newEmail:em});
      S.settings.pendingEmail=em;save();render();toast("Check "+em+" and tap the link to confirm")}
    else{S.settings.email=em;delete S.settings.pendingEmail;if(authOn()){const err=await linkAccount(em,pw);S.settings.authLinked=!err}save();render();toast("Email changed")}
  }catch(e){toast(fbMsg(e.message))}finally{btn.disabled=false}}
/* Gate. Families without a password yet (and the demo family) get a grown-up math question.
   The old 4-digit PIN is no longer offered; a PIN saved earlier still works until a password is set. */
let GATE=null,gateOpen=false;
const newProblem=hard=>{const r=(lo,n)=>lo+Math.floor(Math.random()*n),a=r(12,18),b=hard?r(13,17):r(6,4);return {q:`${a} × ${b}`,ans:a*b}};
function openGate(btn){GATE={btn,mode:S.settings.pw?"pw":S.settings.pin?"pin":"math",tries:0,...newProblem()};renderGate();$("#gate").hidden=false;setTimeout(()=>{const i=$("#gin");if(i)i.focus()},50)}
function closeGate(){$("#gate").hidden=true;GATE=null}
function renderGate(){const m=GATE.mode,head=`<div class="row"><b class="grow" style="font-family:var(--display);font-size:20px;text-align:left">🔒 Grown-ups only</b><button class="no" data-gclose>Cancel</button></div>`;
  if(m==="sent"){$("#gatebox").innerHTML=head+`<div class="pwmsg">📧 We sent a reset link to <b>${esc(maskEmail(S.settings.email))}</b>. Open it, choose a new password, then come back and type the new password here.</div>
    <input id="gin" class="pw" type="password" autocomplete="current-password" aria-label="Parent password" placeholder="New password"><button class="bigbtn" data-gok>Open Parent area</button>`;GATE.mode="pw";bindGin();GATE.mode="sent";return}
  if(m==="newpw"){$("#gatebox").innerHTML=head+`<p class="note">Choose a new parent password.</p><div class="pwf"><input id="gnpw" type="password" autocomplete="new-password" placeholder="New password (8+ characters)" aria-label="New password"><input id="gnpw2" type="password" autocomplete="new-password" placeholder="Type it again" aria-label="Type it again"></div><button class="bigbtn" data-gnewpw>Save and open Parent area</button>`;return}
  const pw=m==="pw",pin=m==="pin";
  $("#gatebox").innerHTML=head+`<p class="note">${pw?"Enter your parent password.":pin?"Enter your parent PIN.":"Answer this to open the Parent area."}</p>
  ${pw||pin?"":`<div class="gq" aria-live="polite">${GATE.q} = ?</div>`}
  <input id="gin" ${pw?`class="pw" type="password" autocomplete="current-password" aria-label="Parent password" placeholder="Password"`:`type="${pin?"password":"text"}" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="${pin?"Parent PIN":"Answer"}" placeholder="${pin?"••••":""}"`}>
  <button class="bigbtn" data-gok>Open Parent area</button>
  ${pw||pin?`<button class="linkbtn" data-gforgot>Forgot ${pw?"password":"PIN"}?</button>`:""}`;bindGin()}
function bindGin(){const i=$("#gin"),m=GATE.mode;i.onkeydown=e=>{if(e.key==="Enter")checkGate()};if(m!=="pw")i.oninput=()=>{i.value=i.value.replace(/\D/g,"");if(m==="pin"&&i.value.length===4)checkGate()}}
function passGate(){const b=GATE.btn,f=GATE.onPass;closeGate();if(f){f();return}gateOpen=true;b.click();gateOpen=false}
async function checkGate(){const v=$("#gin").value;if(!v.trim())return;const m=GATE.mode;
  if(m==="pw"||m==="sent"){
    if(await pwMatches(v)){passGate();if(authOn()&&!S.settings.authLinked&&S.settings.email)linkAccount(S.settings.email,v).then(err=>{if(!err){S.settings.authLinked=true;save()}});return}
    if(authOn()&&S.settings.authLinked&&S.settings.email){try{await fbSignIn(v);await storePw(v);save();passGate();toast("New password saved on this device");return}catch(e){if(e.message==="NETWORK"){toast(fbMsg("NETWORK"));return}}}
    toast("That password isn't right");$("#gin").value="";$("#gin").focus();return}
  const ok=m==="pin"?v===S.settings.pin:+v===GATE.ans;
  if(ok){if(GATE.hard){GATE.mode="newpw";renderGate();return}passGate();return}
  GATE.tries++;Object.assign(GATE,newProblem(GATE.hard));renderGate();toast(m==="pin"?"That PIN isn't right":"Not quite. Try this one.");setTimeout(()=>{const i=$("#gin");if(i)i.focus()},30)}
async function forgotPw(btn){
  if(GATE.mode==="pw"&&authOn()&&S.settings.authLinked&&S.settings.email){btn.disabled=true;
    try{try{await fb("sendOobCode",{requestType:"PASSWORD_RESET",email:S.settings.email})}catch(e){if(e.message!=="EMAIL_NOT_FOUND"||!S.settings.pendingEmail)throw e;await fb("sendOobCode",{requestType:"PASSWORD_RESET",email:S.settings.pendingEmail});S.settings.email=S.settings.pendingEmail;delete S.settings.pendingEmail;save()}GATE.mode="sent";renderGate()}catch(e){btn.disabled=false;toast(fbMsg(e.message))}return}
  /* Email reset isn't switched on for this family yet: fall back to a harder grown-up question, then set a new password. */
  GATE.mode="math";GATE.hard=true;Object.assign(GATE,newProblem(true));renderGate();toast("Answer this, then choose a new password")}
async function gateNewPw(btn){const pw=$("#gnpw").value,prob=pwProblem(pw,$("#gnpw2").value);if(prob){toast(prob);return}
  btn.disabled=true;if(authOn()&&S.settings.email){const err=await linkAccount(S.settings.email,pw);S.settings.authLinked=!err}

document.addEventListener("click",e=>{const t=e.target.closest("[data-gclose],[data-gok],[data-gforgot],[data-gnewpw],[data-pwsave],[data-signout],[data-lockparent],[data-emailsave],[data-signin],[data-siforgot],[data-sinew],[data-wsignup],[data-whave]");if(!t)return;const d=t.dataset;

  if("gclose" in d)closeGate();
  else if("gok" in d)checkGate();
  else if("gforgot" in d)forgotPw(t);

/* ---------- SCREEN TIME LINK (optional, parent-controlled). Prototype simulates usage; a real iPhone app would use Apple's Screen Time API. ---------- */
function scr(k){S.screen=S.screen||{};const d=dayNo();let x=S.screen[k.id];if(!x||x.day!==d)x=S.screen[k.id]={day:d,used:0,extra:0};return x}
const limitOf=k=>(S.settings.screen.limits[k.id]||60);
const timeLeft=k=>{const x=scr(k);return Math.max(0,limitOf(k)+x.extra-x.used)};
const locked=k=>S.settings.screen.on&&timeLeft(k)<=0;
function addMinutes(k,m){scr(k).extra+=m;const r=(S.timeReq||[]).find(q=>q.kid===k.id&&q.state==="asked");if(r)r.state="given"}
const screenMins=t=>{const m=/(\d+)\s*(min|minute)/i.exec(t);return /screen/i.test(t)&&m?+m[1]:0};
function screenChip(k){if(!S.settings.screen.on)return "";const l=timeLeft(k),lim=limitOf(k)+scr(k).extra;
  return `<div class="card scrchip"><div class="row"><span style="font-size:26px" aria-hidden="true">⏱️</span><div class="grow"><b>${l} min of screen time left today</b><div class="bar ${l<10?"warn":"sky"}" style="margin-top:6px"><i style="width:${lim?l/lim*100:0}%"></i></div></div></div>
  <button class="reset" data-simuse style="margin-top:4px">Demo: use 15 minutes</button></div>`}
function lockView(k){const req=(S.timeReq||[]).find(q=>q.kid===k.id&&q.state==="asked");

  ${req?`<div class="tag" style="font-size:13px;padding:8px 14px">⏳ Asked a parent for more time</div>`:`<button class="qbtn" data-askmore style="padding:14px 20px">🙋 Ask a parent for more time</button>`}

  document.querySelectorAll("[data-hwno]").forEach(b=>b.onclick=()=>{const h=S.homework.find(x=>x.id===b.dataset.hwno);dropProof(h.kid,"hw"+h.id);h.state="todo";toast("Sent back to the homework list");save();render()});
  document.querySelectorAll("[data-grade]").forEach(sel=>sel.onchange=()=>{kid(sel.dataset.grade).grade=+sel.value;toast("Grade updated. Quizzes will match it.");save()});
  const ss=$("#setstate");if(ss)ss.onchange=()=>{S.settings.state=ss.value;toast("State set to "+ss.value);save()};
  const sp=$("#setproof");if(sp)sp.onchange=()=>{S.settings.proof=sp.checked;if(!sp.checked)Object.keys(PROOFS).forEach(k=>{const [a,b]=k.split("|");dropProof(a,b)});toast(sp.checked?"Video proof turned on":"Video proof off. Saved clips deleted.");save();render()};
  document.querySelectorAll("[data-opt]").forEach(c=>c.onchange=()=>{S.settings.opts[c.dataset.opt]=c.checked;save();render()});
  const sd=$("#setdel");if(sd)sd.onchange=()=>{S.settings.autoDelete=sd.checked;save()};
  document.querySelectorAll("[data-pdel]").forEach(b=>b.onclick=()=>{const [id,aid]=b.dataset.pdel.split("|");dropProof(id,aid);toast("Clip deleted");render()});
  S.vids=S.vids||{};
  document.querySelectorAll("[data-vok]").forEach(b=>b.onclick=()=>{S.vids[b.dataset.vok]={ok:true};toast("Approved");save();render()});
  document.querySelectorAll("[data-vedit]").forEach(b=>b.onclick=()=>{VEDIT=b.dataset.vedit;render();const i=$("#vin");if(i)i.focus()});
  document.querySelectorAll("[data-vreset]").forEach(b=>b.onclick=()=>{delete S.vids[b.dataset.vreset];toast("Back to the suggested video");save();render()});
  document.querySelectorAll("[data-vform]").forEach(f=>f.onsubmit=e=>{e.preventDefault();const v=$("#vin").value.trim();
    const m=v.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/)||v.match(/^([\w-]{11})$/);
    if(!m){toast("That doesn’t look like a YouTube link");return}
    S.vids[f.dataset.vform]={id:m[1],t:"Your pick ("+m[1]+")",ok:true};VEDIT=null;toast("Saved. Kids will see this video.");save();render()});
  document.querySelectorAll("[data-approve]").forEach(b=>b.onclick=()=>{const [id,aid]=b.dataset.approve.split("|");if(S.settings.autoDelete)dropProof(id,aid);const k=kid(id);S.today[id][aid]="done";const p=award(k,actById(aid));burst(b);toast(`${k.name} got ${p} Stars`);save();render()});
  document.querySelectorAll("[data-deny]").forEach(b=>b.onclick=()=>{const [id,aid]=b.dataset.deny.split("|");dropProof(id,aid);delete S.today[id][aid];toast("Moved back to the quest list");save();render()});
  document.querySelectorAll("[data-rok]").forEach(b=>b.onclick=()=>{const q=S.requests.find(x=>x.id===b.dataset.rok),k=kid(q.kid),r=rewardById(q.reward);
    if(k.stars<r.c){toast(`${k.name} needs ${r.c-k.stars} more Stars`);return}k.stars-=r.c;q.state="given";if(S.settings.screen.on&&screenMins(r.t))addMinutes(k,screenMins(r.t));burst(b);toast(`${r.t} for ${k.name}!`);save();render()});
  document.querySelectorAll("[data-rdeny]").forEach(b=>b.onclick=()=>{S.requests.find(x=>x.id===b.dataset.rdeny).state="later";toast("Saved for later");save();render()});
  document.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>{const r=rewardById(b.dataset.inc);r.c=Math.min(1000,r.c+10);save();render()});
  document.querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>{const r=rewardById(b.dataset.dec);r.c=Math.max(10,r.c-10);save();render()});
  const f=$("#addr");if(f)f.onsubmit=e=>{e.preventDefault();const n=$("#rname").value.trim(),c=parseInt($("#rcost").value,10)||60;if(!n)return;
    S.rewards.push({id:"r"+Date.now(),icon:"🎁",t:n,c:Math.max(5,Math.min(1000,c))});toast("Reward added to the shop");save();render()};
}
// In-app player: videos with a known id play in an embedded YouTube player (no related videos from other channels)
function openPlayer(id,title,url){$("#ptitle").textContent=title||"Video";
  $("#pframe").src="https://www.youtube-nocookie.com/embed/"+id+"?autoplay=1&playsinline=1&rel=0&modestbranding=1";$("#player").hidden=false}
function closePlayer(){$("#pframe").src="about:blank";$("#player").hidden=true}
$("#pclose").onclick=closePlayer;$("#player").onclick=e=>{if(e.target.id==="player")closePlayer()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#player").hidden)closePlayer()});
document.addEventListener("click",e=>{const a=e.target.closest("a[href*='youtube.com/watch?v=']");if(!a)return;
  const id=new URL(a.href).searchParams.get("v");if(!id)return;e.preventDefault();
  const t=(a.querySelector("small")&&a.querySelector("small").textContent.split(" · ")[0])||a.textContent.replace("▶","").trim()||a.getAttribute("aria-label");
  openPlayer(id,t,a.href)});
// Proof clips: held in memory on this device only (never uploaded); parent approves or deletes them
const PROOFS={};
function proofView(id,aid){const p=PROOFS[id+"|"+aid];if(!p)return "";
  if(p.type==="saw")return `<p class="note proofnote">👀 ${esc(kid(id).name)} says a parent saw it</p>`;
  return `<div class="proof">${p.type==="video"?`<video src="${p.url}" controls playsinline preload="metadata"></video>`:`<img src="${p.url}" alt="Photo proof from ${esc(kid(id).name)}">`}
    <button class="no" data-pdel="${id}|${aid}">Delete clip</button></div>`}
function dropProof(id,aid){const k=id+"|"+aid,p=PROOFS[k];if(p&&p.url)URL.revokeObjectURL(p.url);delete PROOFS[k]}
let PCTX=null;
function openProof(k,a){PCTX={k,a};const o=S.settings.opts;$("#optv").hidden=!o.video;$("#opti").hidden=!o.photo;$("#psaw").hidden=!o.saw;$("#prtitle").textContent=a.icon+" "+a.t;$("#proof").hidden=false}
function closeProof(){$("#proof").hidden=true;PCTX=null;$("#pvid").value="";$("#pimg").value=""}
function sendProof(type,url){const {k,a}=PCTX;if(a.hw){a.hw.state="pending";PROOFS[k.id+"|hw"+a.hw.id]={type,url}}else{S.today[k.id][a.id]="pending";PROOFS[k.id+"|"+a.id]={type,url}}closeProof();
  toast(type==="saw"?"Sent to your parent for Stars!":(type==="video"?"Video":"Photo")+" sent to your parent. Only they can see it.");save();render()}
$("#pvid").onchange=e=>{const f=e.target.files[0];if(f)sendProof("video",URL.createObjectURL(f))};
$("#pimg").onchange=e=>{const f=e.target.files[0];if(f)sendProof("photo",URL.createObjectURL(f))};
$("#psaw").onclick=()=>sendProof("saw");$("#prclose").onclick=closeProof;$("#proof").onclick=e=>{if(e.target.id==="proof")closeProof()};
let armed=false;
$("#reset").onclick=()=>{const b=$("#reset");if(!armed){armed=true;b.textContent="Tap again to exit";setTimeout(()=>{armed=false;b.textContent="Exit demo"},2500);return}
  S=seed();save();armed=false;b.textContent="Exit demo";render();toast("Demo closed. Set up your own family!")};
render();
</script>
